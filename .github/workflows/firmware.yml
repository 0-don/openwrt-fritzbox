name: firmware proof

# Run it from your own fork: it fetches the official image and GPL archive from AVM, rebuilds every GPL
# module, proves each against AVM's binary and repacks. The project itself ships only scripts.

on:
  workflow_dispatch:
    inputs:
      model:
        description: AVM directory name, as on download.avm.de/fritzbox (fritzbox-7590-ax, fritzbox-5690-pro, ...)
        required: true
        default: fritzbox-7590-ax
      version:
        description: FRITZ!OS version, or latest
        required: true
        default: latest
      keep_image:
        description: Upload the repacked image as a 1 day artifact (private repositories only, it contains AVM software)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firmware-${{ inputs.model }}-${{ inputs.version }}
  cancel-in-progress: true

env:
  W: ${{ github.workspace }}/../fritz-build
  MODEL: ${{ inputs.model }}
  VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish AVM software
        if: inputs.keep_image && !github.event.repository.private
        run: |
          echo "::error::keep_image needs a private repository: artifacts of public repositories are downloadable by anyone"
          exit 1

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .

      - name: Resolve target
        id: target
        run: |
          python3 -I ci/resolve.py "$MODEL" --version "$VERSION" --env | tee -a "$GITHUB_OUTPUT"
          echo "freetz_rev=$(git ls-remote https://github.com/Freetz-NG/freetz-ng.git HEAD | cut -f1)" | tee -a "$GITHUB_OUTPUT"

      - name: Host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools bc subversion gcc-multilib flex bison libelf-dev libssl-dev kmod
          git clone -q --filter=blob:none https://github.com/Freetz-NG/freetz-ng.git "$RUNNER_TEMP/freetz"
          "$RUNNER_TEMP/freetz/tools/prerequisites" install -y

      - name: Restore GPL archive
        uses: actions/cache@v4
        with:
          path: ${{ env.W }}/${{ inputs.model }}-${{ steps.target.outputs.VERSION }}/dl/${{ steps.target.outputs.ARCHIVE_NAME }}
          key: gpl-${{ steps.target.outputs.ARCHIVE_NAME }}

      - name: Restore Freetz toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.W }}/freetz-ng
          key: freetz-${{ inputs.model }}-${{ steps.target.outputs.freetz_rev }}
          restore-keys: freetz-${{ inputs.model }}-

      - name: Build and prove
        env:
          FREETZ_REV: ${{ steps.target.outputs.freetz_rev }}
        run: ci/run.sh "$MODEL" "${{ steps.target.outputs.VERSION }}"

      - name: Job summary
        if: always()
        run: cat "$W"/*/report/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ inputs.model }}-${{ steps.target.outputs.VERSION }}
          path: ${{ env.W }}/*/report/
          if-no-files-found: warn

      - name: Upload image
        if: inputs.keep_image && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.model }}-${{ steps.target.outputs.VERSION }}
          path: ${{ env.W }}/*/*-gpl-rebuilt.image
          retention-days: 1
